name: Symfony CI

on:
  push:
    branches:
      - main
    paths:
      - "ressources/s5/lucas-le/projets/ci-cd-symfony/**"
      - ".github/workflows/**"        # Permet de relancer si tu modifies le workflow
  workflow_dispatch:                  # ✅ Active le bouton "Run workflow" manuel

defaults:
  run:
    working-directory: ressources/s5/lucas-le/projets/ci-cd-symfony

jobs:
  ci-symfony:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: pcov
          extensions: intl, mbstring, sodium, opcache, pdo_pgsql

      - name: Install dependencies (dev)
        run: composer install --no-progress --prefer-dist --no-scripts

      - name: Run PHP-CS-Fixer
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHP lint
        run: find src tests -name "*.php" -exec php -l {} \;

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse

      - name: Run PHPUnit
        run: ./vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Audit de sécurité
        run: composer audit --format=json --no-interaction
        continue-on-error: true

      # ---------------------------
      #   CONSTRUCTION DE L'ARTEFACT
      # ---------------------------

      - name: Install dependencies (prod)
        run: composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader

      - name: Dump environment variables for production
        run: composer dump-env prod
        env:
          APP_ENV: prod
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Setup Node
        if: hashFiles('ressources/s5/lucas-le/projets/ci-cd-symfony/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        if: hashFiles('ressources/s5/lucas-le/projets/ci-cd-symfony/package.json') != ''
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm i --frozen-lockfile; \
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile; \
          elif [ -f package-lock.json ]; then npm ci; \
          else npm install; fi

      - name: Build assets
        if: hashFiles('ressources/s5/lucas-le/projets/ci-cd-symfony/package.json') != ''
        run: |
          if jq -e '.scripts.build' package.json >/dev/null 2>&1; then \
            npm run build || yarn build || pnpm build; \
          fi

      - name: Warmup cache (prod)
        run: php bin/console cache:warmup --env=prod --no-debug

      - name: Create artifact tarball
        run: |
          tar -czvf symfony-artifact-r1.tar.gz \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=var/cache \
            --exclude=var/log \
            --exclude=tests \
            --exclude=.env \
            --exclude=docker \
            --exclude=docker-compose.yml \
            --exclude=README.md \
            --exclude=*.log \
            --exclude=*.gitignore \
            .

      - name: Debug workspace
        run: |
          pwd
          ls -la
          ls -la symfony-artifact-r1.tar.gz || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: symfony-artifact
          path: ressources/s5/lucas-le/projets/ci-cd-symfony/symfony-artifact-r1.tar.gz
          if-no-files-found: error
